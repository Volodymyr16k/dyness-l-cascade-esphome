  # --- БАЙТ-ХАБ SLAVE БАТАРЕЇ ---
  - platform: template
    id: s_b0_1
    name: "X-Ray Slave Byte 0-1"
    accuracy_decimals: 0
  - platform: template
    id: s_b2_3
    name: "X-Ray Slave Byte 2-3"
