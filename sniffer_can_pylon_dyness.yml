

# Board: ESP32 DevKit V1 (Espressif)
# Driver: SN65HVD230 High-Speed Hardware CAN (500 KBPS)

substitutions:
  devicename: "sniffer-devkitwroom32"
  friendlyname: "Sniffer-DevKitWroom32"
  on_boot:
    priority: -100  # Виконується наприкінці завантаження, коли сенсори вже готові
    then:
      - text_sensor.template.publish:
          id: ts_new_id
          state: "[Sniffer is aktive. Wait ID...]"
          
esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  compile_process_limit: 1  

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1" # Оптимізує бінарний код під вашу ревізію чипа
      sram1_as_iram: true          # Виділяє +40КБ швидкої ОЗУ під CAN-чергу TWAI


logger:
  level: INFO # Рівень INFO захищає від переповнення текстового буфера логів Home Assistant
  
api:
  encryption:
    key: "********************************************"
  reboot_timeout: 15min 
    
web_server:
  port: 80           
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: NONE
  ap:
    ssid: "Sniffer Fallback Hotspot"
    password: "88888888"

captive_portal:

# =======================================================================
# 1. ОГОЛОШЕННЯ СЕНСОРІВ ТА ШАБЛОНІВ (СТРОГО ВИЩЕ ЗА БЛОК CANBUS)
# =======================================================================

text_sensor:
  - platform: template
    id: battery_name
    name: "BMS - Battery Model Name"
  - platform: template
    id: ts_new_id
    name: "Scanner - Newly Discovered CAN ID"

# --- 🛠️ СЕКЦІЯ БІНАРНИХ ФЛАГІВ СТАНУ BMS ---

binary_sensor:
  - platform: template
    id: alarm_cell_overvoltage
    name: "BMS Alarm Cell Overvoltage"
    device_class: "problem"
  - platform: template
    id: alarm_cell_undervoltage
    name: "BMS Alarm Cell Undervoltage"
    device_class: "problem"
  - platform: template
    id: alarm_system_error
    name: "BMS Alarm System Error"
    device_class: "problem"
  - platform: template
    id: flag_charge_enable
    name: "BMS Flag Charge Enable"
    device_class: "connectivity"
  - platform: template
    id: flag_discharge_enable
    name: "BMS Flag Discharge Enable"
    device_class: "connectivity"


sensor:
  - platform: wifi_signal
    name: "Scanner - WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Scanner - Uptime"
    update_interval: 60s
    

